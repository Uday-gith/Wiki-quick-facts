<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commons Leaderboard Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Wiki_s_Lazy_Coders_logo_small_transparent.png/1280px-Wiki_s_Lazy_Coders_logo_small_transparent.png" alt="Wiki's Lazy Coders Logo" class="logo">
    <h1>Commons Leaderboard Tool</h1>
  </header>

  <main class="main-content">
    <div class="card">
      <p>Generate contribution rankings for any Wikimedia Commons category instantly.</p>
      
      <form id="leaderboardForm" class="input-group">
        <input 
          type="text" 
          id="categoryInput" 
          value="Category:Images from Khajuraho Dance Festival 2026" 
          placeholder="Enter a Wikimedia Commons category..." 
          required
        >
        <button type="submit" id="generateBtn">Generate</button>
      </form>
    </div>
  </main>

  <footer class="bottom-footer">
    <p>Created by <a href="#" class="footer-link">Uday Dongre</a></p>
    <p>Project: <a href="#" class="footer-link">Wiki's Lazy Coders</a> | Updated on: 31 March 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
